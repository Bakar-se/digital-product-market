<!DOCTYPE html>
<!-- PROTOTYPE. Throwaway. Three variants of the owner's uncategorized-product list, switchable via ?variant=, because the store has no page yet. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — assign categories</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-100 text-neutral-900">
  <div id="app" class="pb-24"></div>
  <pre id="state" class="fixed right-3 top-3 z-40 max-h-[40vh] w-72 overflow-auto rounded bg-black p-3 text-[11px] leading-snug text-green-300"></pre>
  <div id="switcher" class="fixed bottom-4 left-1/2 z-50 flex -translate-x-1/2 items-center gap-2 rounded-full bg-black px-2 py-1 text-sm text-white shadow-lg"></div>
  <script>
    const CATEGORIES = ["Themes", "Apps", "Logos", "Icons", "Images"];
    const seed = () => ([
      { id: "p1", name: "Aurora Theme", price: "$29", waiting: true, categories: [] },
      { id: "p2", name: "North Icon Pack", price: "$12", waiting: true, categories: [] },
      { id: "p3", name: "Studio Logo Marks", price: "$40", waiting: true, categories: [] },
      { id: "p4", name: "Starter App", price: "Free", waiting: true, categories: [] }
    ]);

    const variants = [
      { key: "A", name: "Inbox" },
      { key: "B", name: "Split" },
      { key: "C", name: "One at a time" }
    ];

    let products = seed();
    let selectedId = products[0].id;
    let focusIndex = 0;

    const params = () => new URLSearchParams(location.search);
    const currentKey = () => {
      const v = (params().get("variant") || "A").toUpperCase();
      return variants.some((x) => x.key === v) ? v : "A";
    };

    function setVariant(key) {
      const next = new URLSearchParams(location.search);
      next.set("variant", key);
      history.replaceState(null, "", "?" + next.toString());
      render();
    }

    function cycle(dir) {
      const i = variants.findIndex((v) => v.key === currentKey());
      const n = (i + dir + variants.length) % variants.length;
      setVariant(variants[n].key);
    }

    function waiting() { return products.filter((p) => p.waiting); }
    function catalog() { return products.filter((p) => !p.waiting); }

    function publish(id) {
      const p = products.find((x) => x.id === id);
      if (!p || p.categories.length === 0) return;
      p.waiting = false;
      const still = waiting();
      if (!still.find((x) => x.id === selectedId)) selectedId = still[0]?.id || null;
      if (focusIndex >= still.length) focusIndex = 0;
      render();
    }

    function toggle(id, category) {
      const p = products.find((x) => x.id === id);
      if (!p || !p.waiting) return;
      p.categories = p.categories.includes(category)
        ? p.categories.filter((c) => c !== category)
        : p.categories.concat(category);
      render();
    }

    function checks(p) {
      return CATEGORIES.map((c) => {
        const on = p.categories.includes(c);
        return `<label class="inline-flex items-center gap-1 text-sm"><input type="checkbox" data-toggle="${p.id}" data-cat="${c}" ${on ? "checked" : ""} /> ${c}</label>`;
      }).join("");
    }

    function variantA() {
      const rows = waiting().map((p) => `
        <li class="flex flex-wrap items-center gap-3 border-b border-neutral-200 px-4 py-3">
          <div class="w-48">
            <div class="font-medium">${p.name}</div>
            <div class="text-sm text-neutral-500">${p.price} · hidden</div>
          </div>
          <div class="flex flex-1 flex-wrap gap-3">${checks(p)}</div>
          <button data-publish="${p.id}" class="rounded bg-black px-3 py-1.5 text-sm text-white disabled:bg-neutral-300" ${p.categories.length ? "" : "disabled"}>Put in catalog</button>
        </li>`).join("") || `<li class="px-4 py-8 text-neutral-500">Nothing is waiting.</li>`;
      return `
        <header class="border-b bg-white px-6 py-4"><p class="text-xs uppercase tracking-wide text-neutral-500">Prototype A · Inbox</p><h1 class="text-xl font-semibold">Waiting for a category</h1></header>
        <ul class="mx-auto mt-6 max-w-5xl overflow-hidden rounded border bg-white">${rows}</ul>`;
    }

    function variantB() {
      const list = waiting().map((p) => `
        <button data-select="${p.id}" class="block w-full border-b px-3 py-3 text-left ${p.id === selectedId ? "bg-neutral-900 text-white" : "bg-white"}">
          <div class="font-medium">${p.name}</div>
          <div class="text-sm opacity-70">${p.price}</div>
        </button>`).join("") || `<p class="p-4 text-neutral-500">Nothing is waiting.</p>`;
      const p = products.find((x) => x.id === selectedId && x.waiting);
      const detail = p ? `
        <h2 class="text-2xl font-semibold">${p.name}</h2>
        <p class="mt-1 text-neutral-500">${p.price}. Hidden until it has a category.</p>
        <div class="mt-6 flex flex-wrap gap-2">${CATEGORIES.map((c) => {
          const on = p.categories.includes(c);
          return `<button data-toggle="${p.id}" data-cat="${c}" class="rounded-full border px-3 py-1.5 text-sm ${on ? "border-black bg-black text-white" : "bg-white"}">${c}</button>`;
        }).join("")}</div>
        <button data-publish="${p.id}" class="mt-8 rounded bg-black px-4 py-2 text-white disabled:bg-neutral-300" ${p.categories.length ? "" : "disabled"}>Put in catalog</button>` : `<p class="text-neutral-500">Select a product.</p>`;
      const shown = catalog().map((p) => `<li class="border-b py-2 text-sm">${p.name} <span class="text-neutral-500">${p.categories.join(", ")}</span></li>`).join("") || `<li class="text-sm text-neutral-500">The catalog is empty.</li>`;
      return `
        <header class="border-b bg-white px-6 py-4"><p class="text-xs uppercase tracking-wide text-neutral-500">Prototype B · Split</p><h1 class="text-xl font-semibold">Assign, then it appears</h1></header>
        <div class="grid min-h-[70vh] grid-cols-[16rem_1fr_16rem]">
          <aside class="border-r bg-white">${list}</aside>
          <main class="bg-neutral-50 p-8">${detail}</main>
          <aside class="border-l bg-white p-4"><h2 class="text-sm font-semibold">In the catalog</h2><ul class="mt-3">${shown}</ul></aside>
        </div>`;
    }

    function variantC() {
      const queue = waiting();
      const p = queue[focusIndex];
      if (!p) return `<main class="mx-auto max-w-xl px-6 py-24 text-center"><h1 class="text-3xl font-semibold">The catalog has every product.</h1></main>`;
      return `
        <main class="mx-auto flex min-h-screen max-w-xl flex-col justify-center px-6">
          <p class="text-sm text-neutral-500">${focusIndex + 1} of ${queue.length} hidden</p>
          <h1 class="mt-2 text-4xl font-semibold">${p.name}</h1>
          <p class="mt-2 text-lg text-neutral-500">${p.price}</p>
          <div class="mt-8 grid grid-cols-2 gap-2">${CATEGORIES.map((c) => {
            const on = p.categories.includes(c);
            return `<button data-toggle="${p.id}" data-cat="${c}" class="rounded border px-3 py-4 text-left text-lg ${on ? "border-black bg-black text-white" : "bg-white"}">${c}</button>`;
          }).join("")}</div>
          <button data-publish="${p.id}" class="mt-8 rounded bg-black py-3 text-white disabled:bg-neutral-300" ${p.categories.length ? "" : "disabled"}>Put this one in the catalog</button>
        </main>`;
    }

    function render() {
      const key = currentKey();
      const body = key === "B" ? variantB() : key === "C" ? variantC() : variantA();
      document.getElementById("app").innerHTML = body;
      document.getElementById("state").textContent = JSON.stringify({
        variant: key,
        waiting: waiting().map((p) => ({ name: p.name, categories: p.categories })),
        catalog: catalog().map((p) => ({ name: p.name, categories: p.categories }))
      }, null, 2);
      const meta = variants.find((v) => v.key === key);
      document.getElementById("switcher").innerHTML = `
        <button id="prev" class="rounded-full px-3 py-1" aria-label="Previous variant">←</button>
        <span class="px-2">${meta.key} (${meta.name})</span>
        <button id="next" class="rounded-full px-3 py-1" aria-label="Next variant">→</button>`;
      document.getElementById("prev").onclick = () => cycle(-1);
      document.getElementById("next").onclick = () => cycle(1);
    }

    document.body.addEventListener("click", (event) => {
      const t = event.target.closest("[data-publish],[data-toggle],[data-select]");
      if (!t) return;
      if (t.dataset.publish) publish(t.dataset.publish);
      if (t.dataset.toggle) toggle(t.dataset.toggle, t.dataset.cat);
      if (t.dataset.select) { selectedId = t.dataset.select; render(); }
    });
    document.body.addEventListener("change", (event) => {
      const t = event.target;
      if (t.dataset && t.dataset.toggle) toggle(t.dataset.toggle, t.dataset.cat);
    });
    document.addEventListener("keydown", (event) => {
      const tag = document.activeElement?.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      if (event.key === "ArrowLeft") cycle(-1);
      if (event.key === "ArrowRight") cycle(1);
    });
    render();
  </script>
</body>
</html>
