<!DOCTYPE html>
<!-- PROTOTYPE. Throwaway. Three variants of the public catalog and product page, switchable via ?variant=. The store has no page yet. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-100 text-neutral-900">
  <div id="app" class="pb-24"></div>
  <pre id="state" class="fixed right-3 top-3 z-40 max-h-[36vh] w-64 overflow-auto rounded bg-black p-3 text-[11px] leading-snug text-green-300"></pre>
  <div id="switcher" class="fixed bottom-4 left-1/2 z-50 flex -translate-x-1/2 items-center gap-2 rounded-full bg-black px-2 py-1 text-sm text-white shadow-lg"></div>
  <script>
    const CATEGORIES = ["Themes", "Apps", "Logos", "Icons", "Images"];
    const products = [
      { id: "p1", name: "Aurora Theme", price: "$29", categories: ["Themes"], description: "A dark theme for an editor. One compressed folder." },
      { id: "p2", name: "North Icon Pack", price: "$12", categories: ["Icons"], description: "A set of interface icons in one folder." },
      { id: "p3", name: "Studio Logo Marks", price: "$40", categories: ["Logos"], description: "Logo files for a small studio." },
      { id: "p4", name: "Starter App", price: "Free", categories: ["Apps"], description: "A free starter project. Download after sign-in." },
      { id: "p5", name: "Field Notes", price: "$8", categories: ["Images"], description: "A folder of reference photographs." },
      { id: "p6", name: "Dashboard Kit", price: "$56", categories: ["Themes", "Apps"], description: "A theme and an app starter, sold together." }
    ];
    const variants = [
      { key: "A", name: "Shelf" },
      { key: "B", name: "Index" },
      { key: "C", name: "Category first" }
    ];
    let filter = "All";
    let openId = null;
    let categoryPick = null;

    const currentKey = () => {
      const v = (new URLSearchParams(location.search).get("variant") || "A").toUpperCase();
      return variants.some((x) => x.key === v) ? v : "A";
    };
    function setVariant(key) {
      const next = new URLSearchParams(location.search);
      next.set("variant", key);
      history.replaceState(null, "", "?" + next.toString());
      render();
    }
    function cycle(dir) {
      const i = variants.findIndex((v) => v.key === currentKey());
      setVariant(variants[(i + dir + variants.length) % variants.length].key);
    }
    const shown = () => filter === "All" ? products : products.filter((p) => p.categories.includes(filter));
    const byId = (id) => products.find((p) => p.id === id);

    function productPage(p, backLabel) {
      return `
        <button data-back class="text-sm text-neutral-500">${backLabel}</button>
        <div class="mt-6 h-48 rounded bg-neutral-200"></div>
        <h1 class="mt-6 text-4xl font-semibold">${p.name}</h1>
        <p class="mt-2 text-neutral-500">${p.categories.join(" · ")}</p>
        <p class="mt-6 max-w-xl text-lg">${p.description}</p>
        <div class="mt-8 flex items-center gap-4">
          <span class="text-2xl">${p.price}</span>
          <button class="rounded bg-black px-4 py-2 text-white">Obtain</button>
        </div>
        <p class="mt-3 text-sm text-neutral-500">Sign-in starts here. Browsing does not require an account.</p>`;
    }

    function variantA() {
      if (openId) {
        return `<main class="mx-auto max-w-3xl px-6 py-10">${productPage(byId(openId), "← Catalog")}</main>`;
      }
      const chips = ["All", ...CATEGORIES].map((c) => `<button data-filter="${c}" class="rounded-full px-3 py-1 text-sm ${filter === c ? "bg-black text-white" : "bg-white"}">${c}</button>`).join("");
      const cards = shown().map((p) => `
        <button data-open="${p.id}" class="rounded border bg-white p-4 text-left">
          <div class="mb-3 h-28 rounded bg-neutral-200"></div>
          <div class="font-medium">${p.name}</div>
          <div class="text-sm text-neutral-500">${p.categories.join(", ")}</div>
          <div class="mt-2">${p.price}</div>
        </button>`).join("");
      return `
        <header class="border-b bg-white px-6 py-4"><p class="text-xs uppercase tracking-wide text-neutral-500">Prototype A · Shelf</p><h1 class="text-xl font-semibold">Catalog</h1></header>
        <div class="mx-auto max-w-5xl px-6 py-6">
          <div class="flex flex-wrap gap-2">${chips}</div>
          <div class="mt-6 grid grid-cols-3 gap-4">${cards}</div>
        </div>`;
    }

    function variantB() {
      if (openId) {
        const p = byId(openId);
        return `
          <main class="mx-auto grid max-w-4xl grid-cols-[1fr_10rem] gap-8 px-6 py-16">
            <div>
              <button data-back class="text-sm text-neutral-500">← Index</button>
              <h1 class="mt-4 text-5xl font-semibold">${p.name}</h1>
              <p class="mt-6 text-lg">${p.description}</p>
              <p class="mt-6 text-sm text-neutral-500">${p.categories.join(" · ")}</p>
            </div>
            <div>
              <div class="text-3xl">${p.price}</div>
              <button class="mt-4 w-full rounded bg-black py-2 text-white">Obtain</button>
              <p class="mt-3 text-xs text-neutral-500">Sign-in starts when you obtain it.</p>
            </div>
          </main>`;
      }
      const rows = shown().map((p) => `
        <button data-open="${p.id}" class="grid w-full grid-cols-[1fr_8rem_5rem] border-b px-2 py-4 text-left">
          <span class="text-lg">${p.name}</span>
          <span class="text-sm text-neutral-500">${p.categories.join(", ")}</span>
          <span class="text-right">${p.price}</span>
        </button>`).join("");
      return `
        <header class="mx-auto max-w-3xl px-6 pt-10"><p class="text-xs uppercase tracking-wide text-neutral-500">Prototype B · Index</p><h1 class="text-3xl font-semibold">All products</h1></header>
        <div class="mx-auto mt-8 max-w-3xl px-6">${rows}</div>`;
    }

    function variantC() {
      if (!categoryPick) {
        const tiles = CATEGORIES.map((c) => {
          const n = products.filter((p) => p.categories.includes(c)).length;
          return `<button data-cat="${c}" class="border-b py-6 text-left text-3xl font-semibold">${c} <span class="text-base font-normal text-neutral-500">${n}</span></button>`;
        }).join("");
        return `
          <main class="mx-auto flex min-h-screen max-w-xl flex-col justify-center px-6">
            <p class="text-xs uppercase tracking-wide text-neutral-500">Prototype C · Category first</p>
            <h1 class="mt-2 text-lg text-neutral-500">Choose a category</h1>
            <div class="mt-6 flex flex-col">${tiles}</div>
          </main>`;
      }
      const list = products.filter((p) => p.categories.includes(categoryPick));
      const p = openId ? byId(openId) : list[0];
      if (p && p.id !== openId) openId = p.id;
      return `
        <main class="mx-auto max-w-3xl px-6 py-10">
          <button data-cats class="text-sm text-neutral-500">← Categories</button>
          <h1 class="mt-4 text-sm uppercase tracking-wide">${categoryPick}</h1>
          <div class="mt-2 h-56 rounded bg-neutral-200"></div>
          <h2 class="mt-6 text-4xl font-semibold">${p.name}</h2>
          <p class="mt-3 max-w-xl">${p.description}</p>
          <div class="mt-6 flex items-center gap-4">
            <span class="text-2xl">${p.price}</span>
            <button class="rounded bg-black px-4 py-2 text-white">Obtain</button>
          </div>
          <div class="mt-10 flex gap-2">${list.map((item) => `<button data-open="${item.id}" class="rounded border px-3 py-2 text-sm ${item.id === p.id ? "bg-black text-white" : "bg-white"}">${item.name}</button>`).join("")}</div>
        </main>`;
    }

    function render() {
      const key = currentKey();
      document.getElementById("app").innerHTML = key === "B" ? variantB() : key === "C" ? variantC() : variantA();
      document.getElementById("state").textContent = JSON.stringify({
        variant: key,
        filter,
        category: categoryPick,
        open: openId ? byId(openId).name : null
      }, null, 2);
      const meta = variants.find((v) => v.key === key);
      document.getElementById("switcher").innerHTML = `
        <button id="prev" class="rounded-full px-3 py-1" aria-label="Previous variant">←</button>
        <span class="px-2">${meta.key} (${meta.name})</span>
        <button id="next" class="rounded-full px-3 py-1" aria-label="Next variant">→</button>`;
      document.getElementById("prev").onclick = () => cycle(-1);
      document.getElementById("next").onclick = () => cycle(1);
    }

    document.body.addEventListener("click", (event) => {
      const t = event.target.closest("[data-open],[data-back],[data-filter],[data-cat],[data-cats]");
      if (!t) return;
      if (t.dataset.open) openId = t.dataset.open;
      if (t.dataset.back) openId = null;
      if (t.dataset.filter) { filter = t.dataset.filter; openId = null; }
      if (t.dataset.cat) { categoryPick = t.dataset.cat; openId = null; }
      if (t.dataset.cats !== undefined && t.hasAttribute("data-cats")) { categoryPick = null; openId = null; }
      render();
    });
    document.addEventListener("keydown", (event) => {
      const tag = document.activeElement?.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      if (event.key === "ArrowLeft") cycle(-1);
      if (event.key === "ArrowRight") cycle(1);
    });
    render();
  </script>
</body>
</html>
